<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árvore Genealógica / Organograma</title>
    <style>
        /* Configurações Globais */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Estrutura da Árvore */
        .tree ul {
            padding-top: 20px; 
            position: relative;
            transition: all 0.5s;
            display: flex;
            justify-content: center;
        }

        .tree li {
            float: left; 
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            transition: all 0.5s;
        }

        /* Conectores Horizontais (Linhas) */
        .tree li::before, .tree li::after {
            content: '';
            position: absolute; 
            top: 0; 
            right: 50%;
            border-top: 2px solid #ccc;
            width: 50%; 
            height: 20px;
        }
        .tree li::after {
            right: auto; 
            left: 50%;
            border-left: 2px solid #ccc;
        }

        /* Remove conectores de elementos únicos/extremidades */
        .tree li:only-child::after, .tree li:only-child::before {
            display: none;
        }
        .tree li:only-child { 
            padding-top: 0;
        }
        .tree li:first-child::before, .tree li:last-child::after {
            border: 0 none;
        }
        .tree li:last-child::before {
            border-right: 2px solid #ccc;
            border-radius: 0 5px 0 0;
        }
        .tree li:first-child::after {
            border-radius: 5px 0 0 0;
        }

        /* Conectores Verticais que descem dos pais */
        .tree ul ul::before {
            content: 'teste';
            position: absolute; 
            top: 0; 
            left: 50%;
            border-left: 2px solid #ccc;
            width: 0; 
            height: 20px;
        }

        /* Estilização dos Blocos (Cartões) */
        .tree li .membro {
            border: 2px solid #ccc;
            padding: 10px 15px;
            text-decoration: none;
            color: #333;
            background-color: #fff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            display: inline-block;
            transition: all 0.5s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Efeito Hover nos Blocos */
        .tree li .membro:hover, .tree li .membro:hover+ul li .membro {
            background: #2ecc71;
            color: #fff;
            border: 2px solid #27ae60;
        }

        /* Conectores mudam de cor no Hover */
        .tree li .membro:hover+ul::before, 
        .tree li .membro:hover+ul li::after, 
        .tree li .membro:hover+ul li::before, 
        .tree li .membro:hover+ul ul::before {
            border-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="tree">
        <ul>
            <li>
                <div class="membro">Patriarca / Matriarca<br><small>Geração 1</small></div>
                <ul>
                    <li>
                        <div class="membro">Filho(a) Velho(a)<br><small>Geração 2</small></div>
                        <ul>
                            <li>
                                <div class="membro">Neto(a) 1<br><small>Geração 3</small></div>
                            </li>
                            <li>
                                <div class="membro">Neto(a) 2<br><small>Geração 3</small></div>
                            </li>
                        </ul>
                    </li>
                    <li>
                        <div class="membro">Filho(a) Caçula<br><small>Geração 2</small></div>
                        <ul>
                            <li>
                                <div class="membro">Neto(a) 3<br><small>Geração 3</small></div>
                            </li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </div>

</body>
</html>
