<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Analógico</title>
    <link rel="stylesheet" href="relogio.css">
</head>
<body>
    <header>
        <h1>Relógico Analógico</h1>
        <p>
            <input type="radio" id="automático" name="modo" checked>
            <label for="automático">Automático</label>
            <input type="radio" id="quartzo" name="modo">
            <label for="quartzo">Quartzo</label>
            <input type="radio" id="continuo" name="modo">
            <label for="continuo">Contínuo</label>
        </p>
        <p>
            <input type="radio" id="datador" name="complicador" checked>
            <label for="datador">Datador</label>
            <input type="radio" id="calendário" name="complicador">
            <label for="calendário">Calendário</label>
        </p>
    </header>
    <main>
        <section>
            <div id="mostrador" class="mostrador">
                <!-- Mostrador do Relógio Aqui -->
            </div>
        </section>
    </main>

    
</body>
    <script src="relogio.js"></script>
</html>
