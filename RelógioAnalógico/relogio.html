<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Analógico</title>
    <link rel="stylesheet" href="relogio.css">
</head>
<body>
    <header>
        <div id="pagina-inicial">
            <a href="../paginaInicial/index.html"><img src="../Arquivos em comum/paginaInicial.png" alt="página Inicial" srcset=""></a>
        </div>
        <h1>Relógico Analógico</h1>
        <p>
            <input type="radio" id="automático" value="200" name="modo" checked>
            <label for="automático">Automático</label>
            <input type="radio" id="quartzo" value="1000" name="modo">
            <label for="quartzo">Quartzo</label>
            <input type="radio" id="continuo" value="50" name="modo">
            <label for="continuo">Contínuo</label>
        </p>
        <p>
            <input type="radio" id="datador" name="complicador" value="datador" >
            <label for="datador">Datador</label>
            <input type="radio" id="calendário" name="complicador" value="calendario">
            <label for="calendário">Calendário</label>
             <input type="radio" id="big-date" name="complicador" value="big-date">
            <label for="big-date">Big Date</label>
        </p>
    </header>
    <main>
        <section>
            <div id="mostrador" class="mostrador">
                <!-- Mostrador do Relógio Aqui -->
            </div>
        </section>
    </main>

    
</body>
    <script src="relogio.js"></script>
</html>
