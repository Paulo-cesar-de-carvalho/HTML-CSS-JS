            <h1>Utilidades</h1>
        </header>
    
        <main>
            <p>
                <label for="data-pascoa">Informe o ano para calular a data da Páscoa </label>
                <input type="number" name="data-pascoa" id="data-pascoa" placeholder="ano" min="1900" max="2099">
                <span id="resultado-data-pascoa"></span>
            </p>
            <p>
                <label for="feriados" >Informe o ano para calular os feriados nacionais</label>
                <input type="number" name="feriados" id="feriados" placeholder="    ano" min="1900" max="2099">
                <div id="resultado-feriados"></div>
            </p>
            <p id="dias-uteis">
                <label for="dias-uteis">Informe o período para calcular os dias úteis, incluindo o primeiro e o último dia:</label>
                <input type="date" name="dias-uteis" id="dias-uteis-inicio" placeholder="inicial">
                <input type="date" name="dias-uteis" id="dias-uteis-fim" placeholder="final">
                <span id="resultado-dias-uteis"></span>
            </p>
        </main>
